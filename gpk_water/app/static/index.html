<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Woda GPK Szemud</title>
<style>
:root{
  --bg:#f3f5fa;--card:#fff;--ink:#1b2233;--mute:#6a7488;--line:#e3e8f1;--accent:#2b3990;--accent2:#4aa3df;
  --good:#2e9d57;--bad:#d64545;--warn:#d98e1a;--chip:#eef2fb;--shadow:0 1px 2px rgba(20,30,60,.06),0 4px 16px rgba(20,30,60,.05);
  --c-home:#3b82c4;--c-garden:#4caf50;--c-sewage:#e0a030;--c-abo:#8b95a7;--c-other:#d9534f;--c-total:#2b3990;--c-trend:#d64545;--c-cost:#8e6bbf;--c-avg:#12a0a0;--c-est:#e8590c;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0e1320;--card:#161d2e;--ink:#e8edf7;--mute:#93a0b8;--line:#25304a;--accent:#7f93ee;--accent2:#5db3ec;
  --chip:#1e2840;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);--c-total:#8fa2f5;
  --c-home:#58a6e6;--c-garden:#66c06a;--c-sewage:#efb54a;--c-abo:#9aa6bb;--c-other:#ee6b67;--c-trend:#ff7d78;--c-cost:#b394e0;--c-avg:#3ccaca;--c-est:#ff8a4c;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,#1c2766,#2b3990 55%,#3f6fc0);color:#fff;padding:8px 16px 0}
.hwrap{max-width:1180px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{background:#fff;border-radius:9px;padding:4px 8px;display:flex}
.logo img{height:26px;display:block}
.ttl{flex:1;min-width:150px}
.ttl h1{margin:0;font-size:15.5px;font-weight:650;letter-spacing:.2px;line-height:1.2}
.ttl small{opacity:.78;font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;font-size:12px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#9aa;display:inline-block}
.dot.ok{background:#4be07a}.dot.err{background:#ff6b6b}.dot.wait{background:#ffd166}
button,.btn{font:inherit;cursor:pointer}
.iconbtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:9px;padding:5px 10px}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:6px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:rgba(255,255,255,.78);padding:8px 14px;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap;font-weight:550}
nav button.on{color:#fff;border-color:#fff}
main{max-width:1180px;margin:0 auto;padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:15px 16px;position:relative}
.kpi{--kc:var(--accent);border-top:4px solid var(--kc);cursor:pointer;transition:transform .12s,box-shadow .12s;background:linear-gradient(180deg,color-mix(in srgb,var(--kc) 9%,var(--card)),var(--card) 70%)}
.kpi:hover{transform:translateY(-2px)}.kpi:active{transform:none}
.kpi .lbl{color:var(--mute);font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.kpi .ic{width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--kc) 18%,transparent);display:grid;place-items:center;font-size:15px;flex:none}
.card.cc{border-top:4px solid var(--kc)}
.kpi.multi{grid-column:span 2}
.kpi.multi .rows{display:grid;gap:0;margin-top:4px}
.kpi.multi .r{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.kpi.multi .r:first-child{border-top:0}
.kpi.multi .r .n{flex:1;color:var(--mute);font-size:13px;display:flex;align-items:center;gap:7px}
.kpi.multi .r .n i{width:9px;height:9px;border-radius:3px;flex:none}
.kpi.multi .r b{font-size:21px;letter-spacing:-.3px}
.kpi.multi .r small{color:var(--mute);font-size:12px;min-width:78px;text-align:right}
@media(max-width:420px){.kpi.multi{grid-column:1/-1}}
.flash{animation:fl 1.2s ease}@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--accent2)}100%{box-shadow:var(--shadow)}}
.kpi .val{font-size:25px;font-weight:700;margin:4px 0 2px;letter-spacing:-.3px;color:var(--kc)}
.kpi .val small{font-size:13px;font-weight:550;color:var(--mute);margin-left:3px}
.kpi .sub{font-size:12.5px;color:var(--mute)}
.up{color:var(--bad)}.down{color:var(--good)}
.cols2{grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))}
h2{font-size:15.5px;margin:0 0 2px}
.hint{color:var(--mute);font-size:12.5px;margin:0 0 10px}
.chartbox{position:relative;height:240px}
.chartbox.tall{height:340px}
.card .tools{position:absolute;right:12px;top:10px}
.card .tools button{background:var(--chip);color:var(--mute);border:0;border-radius:8px;padding:4px 8px;font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.seg{display:inline-flex;background:var(--chip);border-radius:11px;padding:3px}
.seg button{background:none;border:0;color:var(--mute);padding:6px 12px;border-radius:9px;font-weight:550;font-size:13.5px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
select,input[type=search],input[list]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;user-select:none;border:1px solid transparent}
.chip.off{opacity:.45}.chip.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{color:var(--mute);font-weight:600;font-size:12.5px;cursor:pointer;position:sticky;top:0;background:var(--card)}
th.sorted::after{content:" ▾";color:var(--accent)} th.sorted.asc::after{content:" ▴"}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--chip)}
tr.det td{background:var(--chip);white-space:normal;text-align:left}
.tscroll{overflow-x:auto;max-height:70vh}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.b-ok{background:#2e9d5722;color:var(--good)}.b-err{background:#d6454522;color:var(--bad)}.b-wait{background:#d98e1a22;color:var(--warn)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
a{color:var(--accent)}
.kv{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:6px 14px}
.kv div:nth-child(odd){color:var(--mute)}
pre{background:var(--chip);border-radius:12px;padding:12px;overflow:auto;font-size:12.5px;margin:8px 0}
.empty{padding:40px 10px;text-align:center;color:var(--mute)}
.insight{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border:0}
.insight b{min-width:0}
.hide{display:none!important}
@media(max-width:560px){.kpi .val{font-size:22px}main{padding:12px}.chartbox{height:260px}}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="top">
    <div class="logo"><img src="static/logo.png" alt="GPK Szemud"></div>
    <div class="ttl"><h1>Woda – faktury i koszty</h1><small id="sub">ładowanie…</small></div>
    <span class="pill" id="syncpill"><span class="dot wait"></span><span>…</span></span>
    <button class="iconbtn" id="refresh" title="Odśwież">⟳</button>
  </div>
  <nav id="nav">
    <button data-t="over" class="on">Przegląd</button>
    <button data-t="met">Liczniki</button>
    <button data-t="rd">Odczyty</button>
    <button data-t="inv">Faktury</button>
    <button data-t="ent">Encje HA</button>
    <button data-t="stat">Status</button>
  </nav>
</div></header>
<main>
<section id="t-over"></section>
<section id="t-met" class="hide"></section>
<section id="t-rd" class="hide"></section>
<section id="t-inv" class="hide"></section>
<section id="t-ent" class="hide"></section>
<section id="t-stat" class="hide"></section>
</main>
<script src="static/chart.umd.js"></script>
<script>
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const nf = (v, d=2) => v==null||isNaN(v) ? "–" : Number(v).toLocaleString("pl-PL",{minimumFractionDigits:d,maximumFractionDigits:d});
const zl = v => nf(v,2)+" zł";
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const D = s => new Date(s+"T12:00:00").getTime();
const fmtD = s => s ? s.split("-").reverse().join(".") : "–";
const monthShort = t => new Date(t).toLocaleDateString("pl-PL",{month:"short",year:"2-digit"});
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let DATA=null, INV=[], ENT=null;
const F = {range:"all", year:"all", home:true, garden:true, norm:false};
const charts = {};

// ---------- pochodne ----------
function enrich(i){
  const days = Math.max(i.period_days||0,1), vat=1+(i.vat_rate||8)/100;
  i.t = D(i.issue_date);
  i.tmid = (D(i.period_start)+D(i.period_end))/2;
  i.days = days; i.okDays = days>=7;
  i.homeCost = i.gross_water_home+i.gross_sewage+i.gross_abo;
  i.m3 = (i.water_home_m3||0)+(i.water_garden_m3||0);
  i.norm = i.okDays ? i.invoice_gross/days*30.4375 : null;
  i.wp = i.water_price_net*vat; i.sp = i.sewage_price_net*vat; i.ap = i.abo_price_net*vat;
  i.perM3 = i.water_home_m3 ? (i.homeCost)/i.water_home_m3 : null;
  i.m3d_home = i.okDays ? i.water_home_m3/days : null;
  i.m3d_garden = i.okDays ? i.water_garden_m3/days : null;
  i.year = +i.issue_date.slice(0,4);
  return i;
}
function filtered(){
  let r = INV.slice();
  if(F.range!=="all" && F.range!=="year"){
    const last = Math.max(...INV.map(i=>i.t)), cut = last - (+F.range)*30.4375*864e5;
    r = r.filter(i=>i.t>=cut);
  }
  if(F.range==="year" && F.year!=="all") r = r.filter(i=>i.year==F.year);
  return r;
}
function linreg(pts){ // [{x,y}] -> {a,b}
  const n=pts.length; if(n<2) return null;
  const mx=pts.reduce((s,p)=>s+p.x,0)/n, my=pts.reduce((s,p)=>s+p.y,0)/n;
  let sxx=0,sxy=0; pts.forEach(p=>{sxx+=(p.x-mx)**2; sxy+=(p.x-mx)*(p.y-my)});
  if(!sxx) return null; const b=sxy/sxx; return {a:my-b*mx,b};
}
function movavg(arr,k){ return arr.map((_,i)=>{const s=arr.slice(Math.max(0,i-k+1),i+1).filter(v=>v!=null); return s.length?s.reduce((a,b)=>a+b,0)/s.length:null}) }
const pct = (a,b)=> (b? (a/b-1)*100 : null);
const arrow = p => p==null?"":`<span class="${p>0.05?"up":p<-0.05?"down":""}">${p>0?"▲":p<0?"▼":"■"} ${nf(Math.abs(p),1)}%</span>`;

// ---------- wykresy ----------
function chartBase(extra={}){
  const ink=css("--mute"), line=css("--line");
  return Object.assign({responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
    plugins:{legend:{labels:{color:css("--ink"),usePointStyle:true,boxWidth:8,font:{size:12}}},
             tooltip:{backgroundColor:"rgba(15,20,35,.95)",padding:10,cornerRadius:8}},
    scales:{x:{ticks:{color:ink,maxRotation:0,autoSkipPadding:14},grid:{color:line+"88"}},
            y:{ticks:{color:ink},grid:{color:line+"88"},beginAtZero:false}}},extra);
}
function timeAxis(o,R){ // oś X liniowa w czasie
  const pad=12*864e5, ts=(R||INV).flatMap(i=>[i.t,i.tmid]);
  o.scales.x={type:"linear",min:Math.min(...ts)-pad,max:Math.max(...ts)+pad,ticks:{color:css("--mute"),maxRotation:0,maxTicksLimit:8,callback:v=>monthShort(v)},grid:{color:css("--line")+"88"}};
  const prev=o.plugins.tooltip.callbacks||{}; o.plugins.tooltip.callbacks={...prev,title:items=>items.length?fmtD(new Date(items[0].parsed.x).toISOString().slice(0,10)):""};
  return o;
}
function mk(id,cfg){
  if(charts[id]) charts[id].destroy();
  const el=document.getElementById(id); if(!el) return;
  charts[id]=new Chart(el,cfg);
}
function ds(label,color,data,extra={}){return Object.assign({label,data,borderColor:color,backgroundColor:color+"33",borderWidth:2.2,pointRadius:2.5,pointHoverRadius:5,tension:0,cubicInterpolationMode:'monotone'},extra)}
const Y = (label,unit)=>({title:{display:true,text:label,color:css("--mute")},ticks:{color:css("--mute"),callback:v=>nf(v,Number.isInteger(v)?0:(unit==="m3"?2:1))},grid:{color:css("--line")+"88"}});

function drawCharts(){
  const R = filtered(); if(!R.length) return;
  // koszt wg składników
  {
    const f = i => F.norm && i.okDays ? 30.4375/i.days : 1;
    const parts=[["Woda – dom","gross_water_home","--c-home",F.home],["Woda – ogród","gross_water_garden","--c-garden",F.garden],
                 ["Ścieki","gross_sewage","--c-sewage",true],["Abonament","gross_abo","--c-abo",true],["Inne","gross_other","--c-other",true]];
    const dsets=parts.filter(p=>p[3]&&R.some(i=>i[p[1]]>0)).map(p=>({label:p[0],data:R.map(i=>+(i[p[1]]*f(i)).toFixed(2)),backgroundColor:css(p[2]),stack:"s",borderRadius:2}));
    const o=chartBase(); o.scales.x.stacked=true; o.scales.y={stacked:true,...Y(F.norm?"zł / 30 dni":"zł / faktura")};
    o.plugins.tooltip.callbacks={footer:items=>"Razem: "+zl(items.reduce((s,x)=>s+x.parsed.y,0)),title:items=>fmtD(R[items[0].dataIndex].issue_date)};
    o.onClick=(e,els)=>{if(els.length)openInvoice(R[els[0].index].number)}; o.onHover=(e,els)=>{e.native.target.style.cursor=els.length?"pointer":"default"};
    mk("c1",{type:"bar",data:{labels:R.map(i=>monthShort(i.t)),datasets:dsets},options:o});
  }
  drawPrices(R,"c3");
  // zużycie m3 na fakturę
  {
    const sets=[];
    if(F.home) sets.push({label:"Dom m³",data:R.map(i=>i.water_home_m3),backgroundColor:css("--c-home"),stack:"u",borderRadius:2});
    if(F.garden) sets.push({label:"Ogród m³",data:R.map(i=>i.water_garden_m3),backgroundColor:css("--c-garden"),stack:"u",borderRadius:2});
    const o=chartBase(); o.scales.x.stacked=true; o.scales.y={stacked:true,...Y("m³ / faktura","m3")};
    o.plugins.tooltip.callbacks={title:items=>{const i=R[items[0].dataIndex];return fmtD(i.issue_date)+" ("+i.days+" dni)"},
      footer:items=>{const i=R[items[0].dataIndex];return nf((i.water_home_m3+i.water_garden_m3)/i.days*1000,0)+" l/dobę"}};
    o.onClick=(e,els)=>{if(els.length)openInvoice(R[els[0].index].number)}; o.onHover=(e,els)=>{e.native.target.style.cursor=els.length?"pointer":"default"};
    mk("c4",{type:"bar",data:{labels:R.map(i=>monthShort(i.t)),datasets:sets},options:o});
  }
}
function drawPrices(R,id){
  const mkp=(k)=>R.map(i=>({x:i.t,y:+i[k].toFixed(3)}));
  const sets=[ds("Woda",css("--c-home"),mkp("wp"),{stepped:"before",pointRadius:2}),
              ds("Ścieki",css("--c-sewage"),mkp("sp"),{stepped:"before",pointRadius:2}),
              ds("Razem",css("--c-total"),R.map(i=>({x:i.t,y:+(i.wp+i.sp).toFixed(3)})),{stepped:"before",borderDash:[5,4],pointRadius:0})];
  const o=timeAxis(chartBase(),R); o.scales.y=Y("zł / m³ (brutto)");
  mk(id,{type:"line",data:{datasets:sets},options:o});
  const a=R[0],b=R[R.length-1], n=$("#"+id+"note");
  if(n) n.innerHTML=`Woda ${arrow(pct(b.wp,a.wp))} · ścieki ${arrow(pct(b.sp,a.sp))} · razem ${arrow(pct(b.wp+b.sp,a.wp+a.sp))} w wybranym okresie`;
}

// ---------- widoki ----------
function kpi(lbl,val,unit,sub,color,icon,act){return `<div class="card kpi" style="--kc:var(${color})" data-act="${act}" role="button" tabindex="0" title="Kliknij, aby zobaczyć szczegóły"><div class="lbl"><span>${lbl}</span><span class="ic">${icon}</span></div><div class="val">${val}<small>${unit||""}</small></div><div class="sub">${sub||"&nbsp;"}</div></div>`}
function renderOverview(){
  const L=INV[INV.length-1], P=INV[INV.length-2];
  const last12=INV.filter(i=>i.t>=L.t-366*864e5&&i.okDays), prev12=INV.filter(i=>i.t<L.t-366*864e5&&i.t>=L.t-732*864e5&&i.okDays);
  const avg=a=>a.length?a.reduce((s,i)=>s+i.invoice_gross,0)/a.reduce((s,i)=>s+i.days,0)*30.4375:null;
  const a12=avg(last12), ap=avg(prev12);
  const yr=last12.reduce((s,i)=>s+i.water_home_m3,0)/Math.max(last12.reduce((s,i)=>s+i.days,0),1)*365;
  const years=[...new Set(INV.map(i=>i.year))].sort((a,b)=>b-a);
  const yrows=years.map(y=>{const r=INV.filter(i=>i.year===y),g=r.reduce((s,i)=>s+i.invoice_gross,0),m=r.reduce((s,i)=>s+i.m3,0);
    return `<tr class="yr" data-y="${y}" style="cursor:pointer"><td>${y}</td><td>${r.length}</td><td>${nf(r.reduce((s,i)=>s+i.water_home_m3,0),0)}</td><td>${nf(r.reduce((s,i)=>s+i.water_garden_m3,0),0)}</td><td><b>${nf(g)}</b></td><td>${nf(m?g/m:null)}</td></tr>`}).join("");
  $("#t-over").innerHTML=`
  <div class="grid kpis">
    <div id="met-slot" style="display:contents"></div>
    ${kpi("Ostatnia faktura",nf(L.invoice_gross),"zł",`${fmtD(L.issue_date)} · ${nf(L.water_home_m3,0)}+${nf(L.water_garden_m3,0)} m³`,"--c-total","🧾","last")}
    <div class="card kpi multi" style="--kc:var(--c-home)" data-act="prices" role="button" tabindex="0" title="Kliknij, aby zobaczyć wykres cen">
      <div class="lbl"><span>Ceny wody (brutto)</span><span class="ic">💧</span></div>
      <div class="rows">
        <div class="r"><span class="n"><i style="background:var(--c-home)"></i>Woda</span><b style="color:var(--c-home)">${nf(L.wp,2)}</b><small>zł/m³ ${arrow(pct(L.wp,P?P.wp:null))}</small></div>
        <div class="r"><span class="n"><i style="background:var(--c-sewage)"></i>Ścieki</span><b style="color:var(--c-sewage)">${nf(L.sp,2)}</b><small>zł/m³ ${arrow(pct(L.sp,P?P.sp:null))}</small></div>
        <div class="r" data-act="perm3" title="Faktury wg kosztu 1 m³"><span class="n"><i style="background:var(--c-cost)"></i>Realny koszt 1 m³ (dom)</span><b style="color:var(--c-cost)">${nf(L.perM3,2)}</b><small>zł/m³</small></div>
      </div></div>
    ${kpi("Średnio miesięcznie",nf(a12,0),"zł",ap?arrow(pct(a12,ap))+" vs rok wcześniej":"ostatnie 12 mies.","--c-avg","📅","cost")}
    ${kpi("Zużycie roczne (dom)",nf(yr,0),"m³","≈ "+nf(yr*1000/365,0)+" l/dobę","--c-garden","🌿","usage")}
  </div>
  <div class="filters" style="margin-top:14px">
    <div class="seg" id="frange"><button data-r="all">Wszystko</button><button data-r="12">12 mies.</button><button data-r="24">24 mies.</button><button data-r="year">Rok</button></div>
    <select id="fyear" class="${F.range==="year"?"":"hide"}">${years.map(y=>`<option value="${y}">${y}</option>`).join("")}</select>
    <span class="chip" id="fhome"><i style="background:var(--c-home)"></i>Dom</span>
    <span class="chip" id="fgarden"><i style="background:var(--c-garden)"></i>Ogród</span>

let METD=null, MR={range:"30",group:"day"};
function drawMet(){
  const M=METD; if(!M||!M.daily||!$("#cm")) return;
  document.querySelectorAll("#mrange button").forEach(b=>b.classList.toggle("on",b.dataset.r===MR.range));
  document.querySelectorAll("#mgroup button").forEach(b=>b.classList.toggle("on",b.dataset.g===MR.group));
  const last=new Date(M.daily[M.daily.length-1].d+"T12:00:00"), iso=d=>d.toISOString().slice(0,10);
  const shift=n=>{const d=new Date(last);d.setDate(d.getDate()-n+1);return iso(d)};
  let from="0000", to="9999";
  if(MR.range==="month") from=iso(new Date(last.getFullYear(),last.getMonth(),1,12));
  else if(MR.range==="prev"){from=iso(new Date(last.getFullYear(),last.getMonth()-1,1,12));to=iso(new Date(last.getFullYear(),last.getMonth(),0,12))}
  else if(MR.range!=="all") from=shift(+MR.range);
  const rows=M.daily.filter(r=>r.d>=from&&r.d<=to);
  const key=d=>{ if(MR.group==="month") return d.slice(0,7);
    if(MR.group==="week"){const x=new Date(d+"T12:00:00");x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)} return d};
  const g={}; rows.forEach(r=>{const k=key(r.d);(g[k]=g[k]||{home:0,sub:0,n:0});g[k].home+=r.home;g[k].sub+=r.sub;g[k].n++});
  const ks=Object.keys(g).sort();
  const lab=k=>MR.group==="month"?k.slice(5)+"."+k.slice(2,4):k.slice(8)+"."+k.slice(5,7);
  const tH=rows.reduce((s,r)=>s+r.home,0), tS=rows.reduce((s,r)=>s+r.sub,0), n=rows.length||1, p=M.estimate.prices;
  $("#msum").innerHTML=rows.length?`<b>${nf(tH+tS,1)} m³</b> (dom ${nf(tH,1)} + ogród ${nf(tS,1)}) · średnio <b>${nf((tH+tS)/n*1000,0)} l/dobę</b> · koszt wg obecnych cen ≈ <b>${zl(tH*(p.water+p.sewage)+tS*p.water)}</b> (bez abonamentu) · ${rows.length} dni`:"Brak danych w tym zakresie.";
  const unit={day:"dobę",week:"tydzień",month:"miesiąc"}[MR.group];
  const o=chartBase(); o.scales.x.stacked=true; o.scales.y={stacked:true,...Y("m³ / "+unit,"m3")};
  o.plugins.tooltip.callbacks={title:i=>{const k=ks[i[0].dataIndex];return MR.group==="month"?k.slice(5)+"."+k.slice(0,4):MR.group==="week"?"tydzień od "+fmtD(k):fmtD(k)},
    label:c=>`${c.dataset.label}: ${nf(c.parsed.y,2)} m³ (${nf(c.parsed.y*1000,0)} l)`,
    footer:i=>{const k=ks[i[0].dataIndex],x=g[k];return "Razem "+nf(x.home+x.sub,2)+" m³ · "+nf((x.home+x.sub)/x.n*1000,0)+" l/dobę"}};
  mk("cm",{type:"bar",data:{labels:ks.map(lab),datasets:[
    {label:"Dom",data:ks.map(k=>+g[k].home.toFixed(3)),backgroundColor:css("--c-home"),stack:"s"},
    {label:"Ogród",data:ks.map(k=>+g[k].sub.toFixed(3)),backgroundColor:css("--c-garden"),stack:"s"}]},options:o});
}

   <div class="card" style="margin-top:14px"><h2>Statystyki długoterminowe (historia od ${fmtD(INV[0].issue_date)})</h2><p class="hint">Importowane z faktur. Użyj ich w karcie „Statystyki”, nie w kartach encji (to nie są encje, tylko statystyki zewnętrzne).</p>
   <div class="tscroll"><table><thead><tr><th class="l">Nazwa</th><th class="l">ID statystyki</th><th>Jednostka</th></tr></thead><tbody>${stats.map(r=>`<tr><td class="l">${esc(r.name)}</td><td class="l mono"><a href="#" data-c="${esc(r.unique_id)}">${esc(r.unique_id)}</a></td><td>${esc(r.unit)}</td></tr>`).join("")}</tbody></table></div></div>
   <div class="card" style="margin-top:14px"><h2>Gotowa karta Lovelace</h2><p class="hint">Wklej w edytorze karty (kod YAML). Encje są wzięte z Twojego rejestru HA.</p><pre id="yaml">${esc(yaml)}</pre><button class="chip" id="cpy">Kopiuj YAML</button></div>`;
  el.onclick=e=>{const a=e.target.closest("a[data-c]");if(a){e.preventDefault();navigator.clipboard&&navigator.clipboard.writeText(a.dataset.c);a.textContent="skopiowano ✓";setTimeout(()=>renderEnt(),700)}
    if(e.target.id==="cpy"){navigator.clipboard&&navigator.clipboard.writeText(yaml);e.target.textContent="Skopiowano ✓"}};
}

function ago(ts){if(!ts)return "–";const s=Date.now()/1000-ts;if(s<90)return "przed chwilą";if(s<5400)return Math.round(s/60)+" min temu";if(s<172800)return Math.round(s/3600)+" godz. temu";return Math.round(s/86400)+" dni temu"}
function until(ts){if(!ts)return "–";const s=ts-Date.now()/1000;if(s<60)return "za chwilę";if(s<5400)return "za "+Math.round(s/60)+" min";return "za "+Math.round(s/3600)+" godz."}
function renderStatus(){
  const S=DATA.status, m=S.mail_stats||{};
  const fails=S.failed_mails||[];
  $("#t-stat").innerHTML=`<div class="grid cols2">
  <div class="card"><h2>Synchronizacja z Gmailem</h2><div class="kv" style="margin-top:8px">
    <div>Stan</div><div>${S.last_error?`<span class="badge b-err">błąd</span> <span class="mono">${esc(S.last_error)}</span>`:S.last_ok?'<span class="badge b-ok">działa</span>':'<span class="badge b-wait">czeka na pierwszy przebieg</span>'}</div>
    <div>Ostatni przebieg</div><div>${ago(S.last_run)}</div>
    <div>Ostatni udany</div><div>${ago(S.last_ok)}</div>
    <div>Następny</div><div>${until(S.next_run)} (co ${S.interval_h||"?"} godz.)</div>
    <div>Nadawca</div><div class="mono">${esc(DATA.sender||"")}</div>
    <div>Szukane od</div><div>${esc(DATA.since||"")}</div>
    <div>Maile w ostatnim przebiegu</div><div>nowe faktury ${m.new??"–"} · duplikaty ${m.dup??"–"} · nieudane ${m.failed??"–"} · pominięte ${m.skipped??"–"}${m.pdf_backfilled?` · uzupełnione PDF ${m.pdf_backfilled}`:""}</div></div></div>
  <div class="card"><h2>Home Assistant</h2><div class="kv" style="margin-top:8px">
    <div>MQTT</div><div>${S.mqtt_ok===true?'<span class="badge b-ok">połączono</span>':S.mqtt_ok===false?'<span class="badge b-err">błąd połączenia</span>':'–'}</div>
    <div>Import historii</div><div>${S.history_imported?ago(S.history_imported):"jeszcze nie"}</div>
    <div>Faktur w bazie</div><div>${INV.length} (${fmtD(INV[0].issue_date)} – ${fmtD(INV[INV.length-1].issue_date)})</div>
    <div>Wersja dodatku</div><div>${esc(DATA.version)}</div></div></div>
  </div>
  <div class="card" style="margin-top:14px"><h2>Nieodczytane dokumenty</h2>
  ${fails.length||DATA.failed_files.length?`<p class="hint">Dla tych maili parser nie rozpoznał układu. Pobierz i wyślij do analizy.</p>
    <p><a class="chip" href="failed.zip" download>⬇ Pobierz wszystkie (ZIP, ${DATA.failed_files.length})</a></p>
    <ul>${DATA.failed_files.map(n=>`<li><a href="failed/${encodeURIComponent(n)}">${esc(n)}</a></li>`).join("")}</ul>
    ${fails.map(f=>`<div class="mono hint">${esc(f.note)}</div>`).join("")}`:'<p class="hint">Brak. Wszystkie faktury zostały odczytane. ✓</p>'}</div>`;
  const dot=$("#syncpill");
  dot.innerHTML=S.last_error?`<span class="dot err"></span><span>błąd synchronizacji</span>`:S.last_ok?`<span class="dot ok"></span><span>sync ${ago(S.last_ok)}</span>`:`<span class="dot wait"></span><span>oczekiwanie</span>`;
}

function renderAll(){
  INV=DATA.invoices.map(enrich);
  if(!INV.length){$("#t-over").innerHTML=`<div class="card empty">Brak faktur w bazie. Poczekaj na pierwszy przebieg synchronizacji (Status).</div>`;return}
  $("#sub").textContent=`${INV.length} faktur · ${fmtD(INV[0].issue_date)} – ${fmtD(INV[INV.length-1].issue_date)} · v${DATA.version}`;
  renderOverview(); renderInv(); renderStatus(); loadMeters();
  show(cur,true);
}

const ST_PL={sent:"wysłano",failed:"błąd, ponawiam",pending:"w toku",missed:"nie wysłano"};
async function renderReadings(){
  const el=$("#t-rd"); let R;
  try{R=await (await fetch("api/readings")).json()}catch(e){el.innerHTML='<div class="card">Brak połączenia z dodatkiem</div>';return}
  const s=R.settings;
  const hist=R.history.map(h=>`<tr><td>${esc(h.month)}</td><td>${h.kind==="auto"?"auto":"ręcznie"}</td><td>${esc(ST_PL[h.status]||h.status)}</td><td>${esc(h.main||"–")} / ${esc(h.sub||"–")}</td><td>${esc((h.sent_at||h.created||"").replace("T"," ").slice(0,16))}</td><td>${esc(h.error||"")}</td></tr>`).join("");
  el.innerHTML=`<div class="card"><h2>Automatyczna wysyłka stanów liczników</h2>
  <p class="hint">${s.enabled?(R.sent_this_month?"Za "+R.month+" już wysłano. ":"")+"Następny termin: "+esc(R.next_due.replace("T"," ")):"Wyłączona - możesz zostawić swoją automatyzację, dopóki tego nie włączysz."}</p>
  <div class="grid2" style="display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center">
  <div>Włączona</div><div><input type="checkbox" id="r_en" ${s.enabled?"checked":""}></div>
  <div>Dzień miesiąca</div><div><input type="number" id="r_day" min="1" max="28" value="${s.day}" style="width:80px"></div>
  <div>Godzina</div><div><input type="time" id="r_time" value="${esc(s.time)}"></div>
  <div>Ponawiaj przez (dni)</div><div><input type="number" id="r_win" min="1" max="20" value="${s.window_days}" style="width:80px"></div>
  <div>Do</div><div><input id="r_to" value="${esc(s.to)}" style="width:100%"></div>
  <div>Kopia do mnie</div><div><input type="checkbox" id="r_cc" ${s.cc_self?"checked":""}></div>
  <div>Temat maila</div><div><input id="r_sub" value="${esc(s.subject)}" style="width:100%" placeholder="np. Stany liczników + adres"></div>
  <div>Początek treści</div><div><input id="r_intro" value="${esc(s.intro)}" style="width:100%"></div>
  <div>Powiadomienie na telefon</div><div><input id="r_ns" value="${esc(s.notify_service)}" placeholder="notify.mobile_app_..." style="width:100%"></div>
  <div>Blokuj błędne odczyty</div><div><input type="checkbox" id="r_san" ${s.sanity?"checked":""}></div></div>
  <p style="margin-top:12px"><button class="chip" id="r_save">Zapisz</button> <button class="chip" id="r_prev">Podgląd</button> <button class="chip" id="r_send">Wyślij teraz</button></p>
  <pre id="r_out" class="hint" style="white-space:pre-wrap"></pre></div>
  <div class="card" style="margin-top:12px"><h2>Historia wysyłek</h2><div style="overflow:auto"><table ><tr><th>Miesiąc</th><th>Tryb</th><th>Status</th><th>Główny / ogród</th><th>Kiedy</th><th>Uwagi</th></tr>${hist||'<tr><td colspan=6>Brak</td></tr>'}</table></div></div>`;
  const out=t=>$("#r_out").textContent=t;
  $("#r_save").onclick=async()=>{
    const b={enabled:$("#r_en").checked,day:+$("#r_day").value,time:$("#r_time").value,window_days:+$("#r_win").value,to:$("#r_to").value,cc_self:$("#r_cc").checked,subject:$("#r_sub").value,intro:$("#r_intro").value,notify_service:$("#r_ns").value,sanity:$("#r_san").checked};
    const r=await fetch("api/readings/settings",{method:"POST",body:JSON.stringify(b)});
    if(!r.ok){out(await r.text());return} renderReadings()};
  $("#r_prev").onclick=async()=>{const p=await (await fetch("api/readings/preview")).json();
    out(p.ok?`Do: ${p.to.join(", ")}\nTemat: ${p.subject}\n\n${p.body}${p.warning?"\nUWAGA: "+p.warning:""}`:"Nie można odczytać liczników: "+p.error)};
  $("#r_send").onclick=async()=>{
    if(!confirm("Wysłać stany liczników do GPK teraz?"))return;
    out("Wysyłam…");
    let r=await (await fetch("api/readings/send",{method:"POST",body:"{}"})).json();
    if(r.result!=="sent"&&r.record.error&&/mniejszy/.test(r.record.error)&&confirm(r.record.error+"\nWysłać mimo to?"))
      r=await (await fetch("api/readings/send",{method:"POST",body:JSON.stringify({force:true})})).json();
    out(r.result==="sent"?"Wysłano.":"Błąd: "+(r.record.error||"")); setTimeout(renderReadings,2500)};
}
let cur="over";
function show(t,keep){
  cur=t; document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  ["over","met","rd","inv","ent","stat"].forEach(x=>$("#t-"+x).classList.toggle("hide",x!==t));
  if(t==="over") requestAnimationFrame(drawCharts);
  if(t==="ent"&&!keep) renderEnt();
  if(t==="met"&&!keep) renderMeters();
  if(t==="rd"&&!keep) renderReadings();
}
$("#nav").onclick=e=>{const t=e.target.dataset.t;if(t)show(t)};
async function load(){
  try{DATA=await (await fetch("api/data")).json()}catch(e){$("#sub").textContent="brak połączenia z dodatkiem";return}
  if(!DATA.invoices.length){$("#sub").textContent="brak faktur";$("#t-over").innerHTML=`<div class="card empty">Brak faktur w bazie. Poczekaj na pierwszy przebieg synchronizacji.</div>`;
    DATA.invoices=[];INV=[]; $("#t-stat").innerHTML=`<div class="card"><h2>Status</h2><p class="hint">${esc(DATA.status.last_error||"Czekam na pierwszą synchronizację…")}</p></div>`;return}
  renderAll();
}
$("#refresh").onclick=()=>{ENT=null;load()};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(DATA&&INV.length)drawCharts()});
Chart.defaults.font.family='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
load(); setInterval(()=>{if(document.visibilityState==="visible")load()},300000);
</script>
</body>
</html>
